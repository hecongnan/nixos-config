# Palette adapted from Catppuccin Mocha (MIT).
# https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf

background #1e1e2e
foreground #cdd6f4
selection_background #45475a
selection_foreground #f5e0dc
cursor #b4befe
cursor_text_color #1e1e2e
url_color #89dceb

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #9399b2
color9  #eba0ac
color10 #a6e3a1
color11 #f9e2af
color12 #b4befe
color13 #cba6f7
color14 #89dceb
color15 #cdd6f4

# A little breathing room without using an additional row for a single tab.
window_padding_width 4 6
tab_bar_style separator
tab_separator " │ "
tab_bar_background #181825
active_tab_background #b4befe
active_tab_foreground #1e1e2e
inactive_tab_background #181825
inactive_tab_foreground #a6adc8
active_border_color #89b4fa
inactive_border_color #585b70
